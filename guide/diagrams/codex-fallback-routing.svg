<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" role="img" aria-labelledby="route-title route-desc"><title id="route-title">Codex first, quota-gated fallback</title><desc id="route-desc">The authenticated prompt API runs Codex. Success returns its response; ordinary errors remain errors. Only confirmed quota exhaustion and enabled fallback lead to the configured Bedrock or Ollama adapter and the LangGraph workflow.</desc><defs><pattern id="route-grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dbe5ed"/></pattern><marker id="route-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c64d3b"/></marker></defs><g font-family="'Trebuchet MS', 'Segoe UI', sans-serif"><rect width="1500" height="700" rx="24" fill="#f4f8fb"/><rect width="1500" height="700" rx="24" fill="url(#route-grid)"/><text x="42" y="46" font-size="18" fill="#087f83" font-weight="700" letter-spacing="2">CURRENT LAB / REQUEST ROUTING</text><text x="42" y="99" font-size="43" fill="#172f46" font-weight="700" >Codex first. A deliberate fallback.</text><text x="42" y="137" font-size="22" fill="#496477" font-weight="400" >Provider switching requires a confirmed Codex usage-quota error and explicit operator configuration.</text><rect x="42" y="211" width="285" height="240" rx="18" fill="white" stroke="#cedde7" stroke-width="2"/><path d="M60 211H309q18 0 18 18v38H42V229q0-18 18-18" fill="#087f83"/><text x="60" y="247" font-size="22" fill="white" font-weight="700" >Prompt API</text><g transform="translate(64 287)" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="26" width="40" height="32" rx="5"/><path d="M21 26V15c0-16 22-16 22 0v11M32 38v9"/></g><text x="62" y="377" font-size="19" fill="#496477" font-weight="400" >Authenticate caller</text><text x="62" y="405" font-size="19" fill="#496477" font-weight="400" >POST /api/prompt</text><rect x="389" y="211" width="285" height="240" rx="18" fill="white" stroke="#cedde7" stroke-width="2"/><path d="M407 211H656q18 0 18 18v38H389V229q0-18 18-18" fill="#087f83"/><text x="407" y="247" font-size="22" fill="white" font-weight="700" >Codex CLI</text><g transform="translate(411 287)" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="56" height="46" rx="7"/><path d="M14 21l10 10-10 10M32 41h17"/></g><text x="409" y="377" font-size="19" fill="#496477" font-weight="400" >Run codex exec</text><text x="409" y="405" font-size="19" fill="#496477" font-weight="400" >Wait for process exit</text><rect x="737" y="211" width="315" height="240" rx="18" fill="white" stroke="#cedde7" stroke-width="2"/><path d="M755 211H1034q18 0 18 18v38H737V229q0-18 18-18" fill="#7050ad"/><text x="755" y="247" font-size="22" fill="white" font-weight="700" >Quota gate</text><g transform="translate(759 287)" fill="none" stroke="#7050ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="25" r="19"/><path d="M40 40l18 18M17 25h18M26 16v18"/></g><text x="757" y="377" font-size="19" fill="#496477" font-weight="400" >Confirmed quota error?</text><text x="757" y="405" font-size="19" fill="#496477" font-weight="400" >Fallback enabled?</text><rect x="1114" y="211" width="344" height="240" rx="18" fill="white" stroke="#cedde7" stroke-width="2"/><path d="M1132 211H1440q18 0 18 18v38H1114V229q0-18 18-18" fill="#286ba1"/><text x="1132" y="247" font-size="22" fill="white" font-weight="700" >Fallback graph</text><g transform="translate(1136 287)" fill="none" stroke="#286ba1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="16" width="48" height="37" rx="12"/><path d="M32 16V6M26 6h12M20 53v7M44 53v7M2 29v11M62 29v11M22 41h20"/><circle cx="22" cy="30" r="2"/><circle cx="42" cy="30" r="2"/></g><text x="1134" y="377" font-size="19" fill="#496477" font-weight="400" >Bedrock agent or Ollama</text><text x="1134" y="405" font-size="19" fill="#496477" font-weight="400" >Plan → implement → validate</text><path d="M331 330H378" fill="none" stroke="#c64d3b" stroke-width="3"  marker-end="url(#route-arrow)"/><path d="M678 330H726" fill="none" stroke="#c64d3b" stroke-width="3"  marker-end="url(#route-arrow)"/><path d="M1056 330H1103" fill="none" stroke="#c64d3b" stroke-width="3"  marker-end="url(#route-arrow)"/><path d="M531 452V522H365" fill="none" stroke="#c64d3b" stroke-width="3"  marker-end="url(#route-arrow)"/><text x="59" y="529" font-size="22" fill="#087f83" font-weight="700" >Success → Codex response</text><path d="M894 452V575H580" fill="none" stroke="#c64d3b" stroke-width="3"  marker-end="url(#route-arrow)"/><text x="59" y="582" font-size="22" fill="#c64d3b" font-weight="700" >Other failures → return an error</text><text x="1108" y="495" font-size="17" fill="#496477" font-weight="400" >Opt-in provider; no automatic downloads</text><rect x="42" y="620" width="1416" height="46" rx="12" fill="#e9edf5"/><text x="62" y="650" font-size="20" fill="#172f46" font-weight="400" >Use one active request in an isolated workspace. Live provider calls remain unverified.</text></g></svg>