<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 740" role="img" aria-labelledby="workflow-title workflow-desc"><title id="workflow-title">Bounded LangGraph execution</title><desc id="workflow-desc">Plan reads selected files. Implement accepts JSON replacements only for allowed paths. Validate runs operator-configured commands. Failed checks permit one repair, with two implementation attempts maximum. Missing or failed checks produce needs_validation; all configured checks passing produces validated. Private checkpoints record each stage.</desc><defs><pattern id="workflow-grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dbe5ed"/></pattern><marker id="workflow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c64d3b"/></marker></defs><g font-family="'Trebuchet MS', 'Segoe UI', sans-serif"><rect width="1500" height="740" rx="24" fill="#f4f8fb"/><rect width="1500" height="740" rx="24" fill="url(#workflow-grid)"/><text x="42" y="46" font-size="18" fill="#087f83" font-weight="700" letter-spacing="2">CURRENT LAB / FALLBACK EXECUTION</text><text x="42" y="99" font-size="43" fill="#172f46" font-weight="700" >Plan, implement, verify—with a limit.</text><text x="42" y="137" font-size="22" fill="#496477" font-weight="400" >The model proposes changes. Local code owns the file boundaries and check commands.</text><rect x="42" y="210" width="300" height="260" rx="18" fill="white" stroke="#cedde7" stroke-width="2"/><path d="M60 210H324q18 0 18 18v38H42V228q0-18 18-18" fill="#087f83"/><text x="60" y="246" font-size="22" fill="white" font-weight="700" >Plan</text><g transform="translate(64 286)" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h25l12 13v43H15zM40 4v14h12M23 30h21M23 39h21M23 48h15"/></g><text x="62" y="376" font-size="19" fill="#496477" font-weight="400" >Read selected source</text><text x="62" y="404" font-size="19" fill="#496477" font-weight="400" >Save the plan</text><text x="62" y="432" font-size="19" fill="#496477" font-weight="400" >LAB_EDIT_FILES</text><rect x="414" y="210" width="300" height="260" rx="18" fill="white" stroke="#cedde7" stroke-width="2"/><path d="M432 210H696q18 0 18 18v38H414V228q0-18 18-18" fill="#286ba1"/><text x="432" y="246" font-size="22" fill="white" font-weight="700" >Implement</text><g transform="translate(436 286)" fill="none" stroke="#286ba1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="56" height="46" rx="7"/><path d="M14 21l10 10-10 10M32 41h17"/></g><text x="434" y="376" font-size="19" fill="#496477" font-weight="400" >JSON file replacements</text><text x="434" y="404" font-size="19" fill="#496477" font-weight="400" >Reject unselected paths</text><text x="434" y="432" font-size="19" fill="#496477" font-weight="400" >Apply allowed proposals</text><rect x="786" y="210" width="300" height="260" rx="18" fill="white" stroke="#cedde7" stroke-width="2"/><path d="M804 210H1068q18 0 18 18v38H786V228q0-18 18-18" fill="#7050ad"/><text x="804" y="246" font-size="22" fill="white" font-weight="700" >Validate</text><g transform="translate(808 286)" fill="none" stroke="#7050ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="26"/><path d="M18 32l10 10 19-23"/></g><text x="806" y="376" font-size="19" fill="#496477" font-weight="400" >Run configured argv</text><text x="806" y="404" font-size="19" fill="#496477" font-weight="400" >Record bounded output</text><text x="806" y="432" font-size="19" fill="#496477" font-weight="400" >Model cannot pick checks</text><rect x="1158" y="210" width="300" height="260" rx="18" fill="white" stroke="#cedde7" stroke-width="2"/><path d="M1176 210H1440q18 0 18 18v38H1158V228q0-18 18-18" fill="#087f83"/><text x="1176" y="246" font-size="22" fill="white" font-weight="700" >Record outcome</text><g transform="translate(1180 286)" fill="none" stroke="#087f83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="12" rx="24" ry="9"/><path d="M8 12v38c0 13 48 13 48 0V12M8 30c0 13 48 13 48 0"/></g><text x="1178" y="376" font-size="19" fill="#496477" font-weight="400" >validated: checks pass</text><text x="1178" y="404" font-size="19" fill="#496477" font-weight="400" >needs_validation: absent</text><text x="1178" y="432" font-size="19" fill="#496477" font-weight="400" >or failed checks</text><path d="M347 337H403" fill="none" stroke="#c64d3b" stroke-width="3"  marker-end="url(#workflow-arrow)"/><path d="M719 337H775" fill="none" stroke="#c64d3b" stroke-width="3"  marker-end="url(#workflow-arrow)"/><path d="M1091 337H1147" fill="none" stroke="#c64d3b" stroke-width="3"  marker-end="url(#workflow-arrow)"/><path d="M936 473V538H564V476" fill="none" stroke="#7050ad" stroke-width="3"  marker-end="url(#workflow-arrow)"/><text x="550" y="573" font-size="22" fill="#7050ad" font-weight="700" >Failed checks → one repair; at most two implementation attempts</text><rect x="42" y="623" width="1416" height="76" rx="14" fill="#e3f2f2"/><text x="62" y="654" font-size="21" fill="#087f83" font-weight="700" >Private stage checkpoints preserve the plan, changed files, attempts and check results.</text><text x="62" y="683" font-size="20" fill="#496477" font-weight="400" >Task records do not provide automatic crash resume or cross-task knowledge memory.</text></g></svg>