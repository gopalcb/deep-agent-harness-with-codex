[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Codex-first durable engineering lab"
requires-python = ">=3.11"
dependencies = ["langchain>=1.0", "langgraph>=1.0", "deepagents>=0.3", "langgraph-checkpoint-sqlite>=3.0", "langgraph-checkpoint-postgres>=3.0", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.10", "httpx>=0.28", "structlog>=25", "langchain-mcp-adapters>=0.1"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 100
[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
